# fly.toml app configuration file generated for pragmacrm-api on 2026-10-12T15:25:42-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Secrets (DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, API_KEY, CORS_ORIGIN)
# live in `fly secrets`, never here.

app = 'pragmacrm-api'
primary_region = 'ord'

# app.ts waits up to 8 s for in-flight requests on SIGTERM.
kill_signal = 'SIGTERM'
kill_timeout = '10s'

# Safety net for the RF-03 initial backfill (~330 MB peak, docs/DEPLOY_DOKPLOY.md).
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  STAGE = 'prod'
  NODE_ENV = 'production'
  PORT = '3000'
  LOG_LEVEL = 'info'
  BUSINESS_TIMEZONE = 'America/El_Salvador'
  # V8 caps the heap well below 512 MB by default; a 100 MB upload would hit it.
  NODE_OPTIONS = '--max-old-space-size=384'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
